# TP18 partie 3 : ExternalSecret qui crée et tient à jour le Secret Kubernetes "api-credentials".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-credentials
  namespace: tp18
spec:
  refreshInterval: 30s # en production : plutôt 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: api-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: "tp18/api" # chemin du secret dans Vault, sans le préfixe secret/ (ex. tp18/api)
        property: "api-key" # clé dans le secret Vault
