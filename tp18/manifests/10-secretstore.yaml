# TP18 partie 3 : connexion d'External Secrets Operator à Vault (authentification Kubernetes).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: tp18
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret" # moteur KV monté sur secret/
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "tp18-app" # rôle Vault créé en partie 2
          serviceAccountRef:
            name: "app-sa"
